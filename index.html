<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>万博クロッシング こみゃく</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;color:#fff}
header{height:140px;flex:0 0 140px;background:#10283b;padding:8px 10px;z-index:50;box-shadow:0 3px 10px #0008}
.title{height:34px;text-align:center;font-size:18px;font-weight:900;line-height:34px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.card{background:#17374d;border-radius:9px;padding:5px;text-align:center;font-size:10px}
.card b{display:block;font-size:18px;margin-top:1px}
#game{position:relative;flex:1;min-height:0;overflow:hidden;background:#76b94d}
#world{position:absolute;inset:0;overflow:hidden;background:#76b94d}
#status{position:absolute;left:12px;right:12px;top:10px;padding:7px 8px;background:#315b22e8;border-radius:12px;text-align:center;font-size:11px;z-index:40}
#roadLayer,#carLayer,#playerLayer{position:absolute;inset:0;pointer-events:none}
.roadseg{position:absolute;left:50%;transform:translateX(-50%);height:72px;background:#55565a;border-left:2px solid #444;border-right:2px solid #444;overflow:hidden}
.roadseg:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed rgba(255,255,255,.65)}
.roadseg.grass{background:transparent;border:0}
.river{position:absolute;left:50%;transform:translateX(-50%);height:72px;background:#409dd4;border-top:2px solid #8bd8ff88;border-bottom:2px solid #8bd8ff88}
.tree{position:absolute;transform:translate(-50%,-50%);font-size:34px;line-height:1;z-index:8}
.car{position:absolute;width:70px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 5px 8px #0008;z-index:20;will-change:left}
.car.bus{width:88px;background:#e5b41e}
.car.normal{background:#d63b3e}
.player{position:absolute;transform:translate(-50%,-75%);z-index:30;width:48px;height:48px;filter:drop-shadow(0 6px 4px #0007);will-change:left,top}
.player img{width:100%;height:100%;display:block;object-fit:contain}
.player.dead{animation:squash .55s ease-out forwards}
@keyframes squash{0%{transform:translate(-50%,-75%) scale(1)}30%{transform:translate(-50%,-75%) scale(1.35,.62) rotate(-7deg)}60%{transform:translate(-50%,-75%) scale(1.5,.48) rotate(7deg)}100%{transform:translate(-50%,-75%) scale(1,.4);opacity:.4}}
#toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.8);background:#000d;padding:12px 18px;border-radius:16px;font-weight:900;font-size:22px;opacity:0;z-index:60;transition:.15s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#controls{height:88px;flex:0 0 88px;background:#0d2233;padding:7px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:50}
.ctrl{border:0;border-radius:11px;color:#fff;font-weight:900;font-size:12px;padding:5px 2px;touch-action:manipulation}
.ctrl small{display:block;font-size:9px;opacity:.85}
.red{background:#d42f35}.blue{background:#2e69c9}.yellow{background:#bd8e08}.green{background:#2f8d52}
#footer{height:28px;flex:0 0 28px;background:#0d2233;text-align:center;font-size:9px;opacity:.8;padding-top:7px}
</style>
</head>
<body>
<div id="app">
<header>
<div class="title">🌏 万博クロッシング　こみゃく</div>
<div class="scores">
<div class="card">今回の試合ハイスコア<b id="matchHigh">0</b></div>
<div class="card">あなたのハイスコア<b id="myHigh">0</b></div>
<div class="card">全体ハイスコア<b id="allHigh">0</b></div>
</div>
</header>
<div id="game">
<div id="world">
<div id="roadLayer"></div><div id="carLayer"></div><div id="playerLayer"></div>
<div id="status">タップで1マス前進</div><div id="toast"></div>
</div>
</div>
<div id="controls">
<button class="ctrl red" onclick="move(0)">🔴 こみゃく<small>タップで前進</small></button>
<button class="ctrl blue" onclick="move(1)">🔵 こみゃく<small>タップで前進</small></button>
<button class="ctrl yellow" onclick="move(2)">🟡 こみゃく<small>タップで前進</small></button>
<button class="ctrl green" onclick="move(3)">🟢 こみゃく<small>タップで前進</small></button>
</div>
<div id="footer">ゴールなし・エンドレス／スコア＝進んだマス数</div>
</div>

function type(r){ if(r<1)return"grass"; if(r%5===2||r%8===0)return"road"; if(r%13===0)return"river"; return"grass"; }
function ensure(){
  for(let r=Math.max(0,Math.floor(cam)-3);r<=Math.ceil(cam)+18;r++){
    if(!roads.has(r)) roads.set(r,type(r));
    if(roads.get(r)==="road"&&!cars.some(c=>c.row===r)){
      const dir=r%2?1:-1;
      const n=r%6===0?1:2;
      for(let i=0;i<n;i++)cars.push({row:r,dir,x:dir>0?-110-i*100:world.clientWidth+20+i*100,speed:r%6===0?70:48+(r%4)*8,bus:r%6===0});
    }
  }
}
function geom(r){
  const d=r-cam;
  const t=Math.max(0,Math.min(1,(d+1)/17));
  const y=world.clientHeight*.88-t*world.clientHeight*.70;
  const scale=.48+(1-t)*.72;
  const width=world.clientWidth*(.42+.48*(1-t));
  return {y,scale,width};
}
function render(){
  ensure();
  roadLayer.innerHTML="";carLayer.innerHTML="";playerLayer.innerHTML="";
  const lo=Math.floor(cam)-2,hi=Math.ceil(cam)+18;
  for(let r=lo;r<=hi;r++){
    const p=geom(r), kind=roads.get(r);
    if(kind==="road"){
      const el=document.createElement("div");el.className="roadseg";
      el.style.top=(p.y-36*p.scale)+"px";el.style.width=p.width+"px";el.style.height=(72*p.scale)+"px";
      roadLayer.appendChild(el);
    } else if(kind==="river"){
      const el=document.createElement("div");el.className="river";
      el.style.top=(p.y-36*p.scale)+"px";el.style.width=(p.width*.92)+"px";el.style.height=(72*p.scale)+"px";
      roadLayer.appendChild(el);
    }
    if(r%2===0&&r>=0){
      for(const side of [-1,1]){
        const tr=document.createElement("div");tr.className="tree";tr.textContent="🌳";
        tr.style.left=(world.clientWidth/2+side*(p.width/2+28*p.scale))+"px";
        tr.style.top=p.y+"px";tr.style.fontSize=(34*p.scale)+"px";roadLayer.appendChild(tr);
      }
    }
  }
  for(const c of cars){
    if(c.row<lo||c.row>hi)continue;
    const p=geom(c.row);
    const el=document.createElement("div");el.className="car "+(c.bus?"bus":"normal");
    el.textContent=c.bus?"🚌":"🚗";
    el.style.left=c.x+"px";el.style.top=(p.y-22*p.scale)+"px";
    el.style.transform="translateX(-50%) scale("+p.scale+")";
    carLayer.appendChild(el);
  }
  players.forEach((pl,i)=>{
    if(!pl.alive)return;
    const p=geom(pl.row);
    const el=document.createElement("div");el.className="player";
    const lane=.28*pl.lane;
    el.style.left=(world.clientWidth/2+lane*p.width)+"px";
    el.style.top=(p.y-5*p.scale)+"px";
    el.style.width=(48*p.scale)+"px";el.style.height=(48*p.scale)+"px";
    el.innerHTML='<img src="'+IMGS[pl.color]+'" alt="こみゃく">';
    playerLayer.appendChild(el);
  });
  updateText();
}
function collision(pl){
  if(roads.get(pl.row)!=="road")return false;
  const p=geom(pl.row), px=world.clientWidth/2+.28*pl.lane*p.width;
  for(const c of cars){
    if(c.row!==pl.row)continue;
    if(Math.abs(c.x-px)<(c.bus?52:43)*p.scale)return true;
  }
  return false;
}
function move(i){
  if(over)return;
  const p=players[i];if(!p.alive)return;
  p.row++;p.score++;maxScore=Math.max(maxScore,p.row);matchHigh=Math.max(matchHigh,p.score);
  ensure();
  if(collision(p)){
    p.alive=false;
    document.getElementById("toast").textContent="こみゃく ぺしゃんこ！";
    document.getElementById("toast").classList.add("show");
    setTimeout(()=>document.getElementById("toast").classList.remove("show"),600);
  }
  cam=Math.max(0,maxScore-2.3);
  cleanup();render();updateScores();
  const alive=players.filter(x=>x.alive).length;
  if(!alive){over=true;document.getElementById("status").textContent="4人全員アウト";}
}
function cleanup(){
  const min=cam-4;
  for(let i=cars.length-1;i>=0;i--)if(cars[i].row<min)cars.splice(i,1);
}
function updateText(){
  const alive=players.filter(x=>x.alive).length;
  document.getElementById("status").textContent=alive?`進行中：残り ${alive}人　／　最高到達 ${maxScore}マス`:"4人全員アウト";
}
function updateScores(){
  const my=Math.max(...players.map(p=>p.score),0);
  const mh=+localStorage.getItem("komyakuMyHigh")||0,ah=+localStorage.getItem("komyakuAllHigh")||0;
  if(my>mh)localStorage.setItem("komyakuMyHigh",my);
  if(maxScore>ah)localStorage.setItem("komyakuAllHigh",maxScore);
  document.getElementById("matchHigh").textContent=matchHigh;
  document.getElementById("myHigh").textContent=Math.max(my,mh);
  document.getElementById("allHigh").textContent=Math.max(maxScore,ah);
}
function tick(t){
  if(!tick.last)tick.last=t;const dt=Math.min(.04,(t-tick.last)/1000);tick.last=t;
  if(!over)for(const c of cars){c.x+=c.dir*c.speed*dt;if(c.x>world.clientWidth+130)c.x=-130;if(c.x<-130)c.x=world.clientWidth+130;}
  render();requestAnimationFrame(tick);
}
function start(){
  ensure();render();updateScores();requestAnimationFrame(tick);
}
window.addEventListener("resize",render);
start();
</script>
</body>
</html>
