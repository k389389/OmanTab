<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>万博クロッシング こみゃく</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#app{height:100%;display:flex;flex-direction:column;color:#fff}
header{background:#10283b;padding:7px 9px;z-index:10;box-shadow:0 3px 10px #0008}
.title{text-align:center;font-size:17px;font-weight:900}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.card{background:#17374d;border-radius:9px;padding:4px;text-align:center;font-size:9px}
.card b{display:block;font-size:16px;margin-top:1px}
#game{position:relative;flex:1;min-height:0;overflow:hidden;background:#73b84b}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;left:12px;right:12px;top:10px;padding:7px 8px;background:#274c1ddd;border-radius:12px;text-align:center;font-size:11px;z-index:4}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);opacity:0;background:#000d;padding:12px 18px;border-radius:16px;font-weight:900;font-size:22px;z-index:8;transition:.15s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#controls{background:#0d2233;padding:7px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:10}
.ctrl{border:0;border-radius:11px;color:#fff;font-weight:900;font-size:12px;padding:8px 2px;touch-action:manipulation}
.ctrl small{display:block;font-size:9px;opacity:.85}
.red{background:#d42f35}.blue{background:#2e69c9}.yellow{background:#bd8e08}.green{background:#2f8d52}
#next{display:none;margin:5px 8px;border:0;border-radius:10px;padding:8px;font-weight:900}
.legend{background:#0d2233;color:#fff;text-align:center;font-size:9px;opacity:.75;padding:2px 0 4px}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="title">🌏 万博クロッシング　こみゃく</div>
 <div class="scores">
  <div class="card">今回の試合ハイスコア<b id="matchHigh">0</b></div>
  <div class="card">あなたのハイスコア<b id="myHigh">0</b></div>
  <div class="card">全体ハイスコア<b id="allHigh">0</b></div>
 </div>
</header>
<div id="game">
 <canvas id="cv"></canvas>
 <div id="status">タップで1マス前進</div>
 <div id="toast"></div>
</div>
<div id="controls">
 <button class="ctrl red" onclick="movePlayer(0)">🔴 こみゃく<small>タップで前進</small></button>
 <button class="ctrl blue" onclick="movePlayer(1)">🔵 こみゃく<small>タップで前進</small></button>
 <button class="ctrl yellow" onclick="movePlayer(2)">🟡 こみゃく<small>タップで前進</small></button>
 <button class="ctrl green" onclick="movePlayer(3)">🟢 こみゃく<small>タップで前進</small></button>
</div>
<button id="next" onclick="nextGroup()">次の4人をスタート</button>
<div class="legend">ゴールなし・エンドレス／スコア＝進んだマス数</div>
</div>

  if(r<1)return"grass";
  if(r%5===2 || r%8===0)return"road";
  if(r%13===0)return"river";
  return"grass";
}
function ensureWorld(){
  const lo=Math.max(0,Math.floor(cam)-5), hi=Math.ceil(cam)+28;
  for(let r=lo;r<=hi;r++){
    if(laneType(r)!=="road")continue;
    if(obstacles.some(o=>o.row===r))continue;
    const dir=r%2?1:-1;
    const n=r%6===0?1:2;
    for(let i=0;i<n;i++)obstacles.push({
      row:r,dir,x:dir>0?-1.7-i*1.5:1.7+i*1.5,
      speed:r%6===0?.55:.38+(r%4)*.035,
      width:r%6===0?.62:.42,
      kind:r%6===0?"bus":"car"
    });
  }
}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);

function depth(row){return row-cam}
function screen(row){
  const d=depth(row);
  // Crossy Road風：画面中央の消失点へ向かって道路が細くなる
  const t=Math.max(-.05,Math.min(1.12,(d+1)/15));
  const y=H*.86 - t*H*.70;
  const scale=.46 + (1-t)*.68;
  return {t,y,scale};
}
function roadWidth(p){return W*(.86-(1-p.t)*.36)}
function roadCenter(p){return W/2}
function drawQuad(x1,y1,x2,y2,x3,y3,x4,y4,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();
}
function drawWorld(){
  ctx.fillStyle="#74b94b";ctx.fillRect(0,0,W,H);

  // 木々を奥行きに沿って置く
  for(let r=Math.max(0,Math.floor(cam)-2);r<Math.ceil(cam)+27;r+=2){
    const p=screen(r); if(p.y<20||p.y>H+80)continue;
    const s=p.scale*.55, size=42*s;
    ctx.font=size+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("🌳",W*.10,p.y);
    ctx.fillText("🌳",W*.90,p.y);
  }

  // 連続した1本の道路。行ごとに台形を重ねるが境界を極力見せない。
  for(let r=Math.max(0,Math.floor(cam)-2);r<Math.ceil(cam)+27;r++){
    const type=laneType(r);
    if(type==="road"){
      const a=screen(r),b=screen(r+1);
      const wa=roadWidth(a),wb=roadWidth(b);
      drawQuad(W/2-wa/2,a.y,W/2+wa/2,a.y,W/2+wb/2,b.y,W/2-wb/2,b.y,"#55565a");
      // 車線の白い破線（奥行き方向）
      if(r%2===0){
        ctx.strokeStyle="#ffffff99";ctx.lineWidth=Math.max(1,2*a.scale);
        ctx.setLineDash([18*a.scale,18*a.scale]);
        ctx.beginPath();ctx.moveTo(W/2,a.y);ctx.lineTo(W/2,b.y);ctx.stroke();ctx.setLineDash([]);
      }
      // 道路端
      ctx.strokeStyle="#45464a";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(W/2-wa/2,a.y);ctx.lineTo(W/2-wb/2,b.y);ctx.moveTo(W/2+wa/2,a.y);ctx.lineTo(W/2+wb/2,b.y);ctx.stroke();
    } else if(type==="river"){
      const a=screen(r),b=screen(r+1),wa=roadWidth(a)*.9,wb=roadWidth(b)*.9;
      drawQuad(W/2-wa/2,a.y,W/2+wa/2,a.y,W/2+wb/2,b.y,W/2-wb/2,b.y,"#3f9ed5");
    }
  }
}
function xScreen(x,row){
  const p=screen(row), rw=roadWidth(p);
  return W/2+x*(rw*.48);
}
function drawObstacle(o){
  if(o.row<cam-2||o.row>cam+28)return;
  const p=screen(o.row), x=xScreen(o.x,o.row);
  const s=p.scale*.55;
  const w=(o.kind==="bus"?95:74)*s,h=43*s;
  ctx.save();ctx.translate(x,p.y-h*.32);
  ctx.shadowColor="#0008";ctx.shadowBlur=6*s;ctx.shadowOffsetY=5*s;
  ctx.fillStyle=o.kind==="bus"?"#e8b321":"#d63b3e";
  roundRect(-w/2,-h/2,w,h,9*s);ctx.fill();
  ctx.shadowColor="transparent";ctx.font=(26*s)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(o.kind==="bus"?"🚌":"🚗",0,1);ctx.restore();
}
function drawPlayer(p){
  if(!p.alive)return;
  const q=screen(p.row),x=xScreen(p.lane*.38,p.row);
  // こみゃくをかなり小さく。奥行きに応じて縮小。
  const s=Math.max(.34,q.scale*.48), size=56*s;
  const y=q.y-24*s;
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor="#0008";ctx.shadowBlur=5*s;ctx.shadowOffsetY=4*s;
  if(imgs[p.color].complete)ctx.drawImage(imgs[p.color],-size/2,-size/2,size,size);
  ctx.restore();
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function collision(p){
  if(laneType(p.row)!=="road")return false;
  for(const o of obstacles){
    if(o.row!==p.row)continue;
    if(Math.abs(p.lane*.38-o.x)<.16+o.width/2)return true;
  }
  return false;
}
function movePlayer(id){
  if(roundOver)return;
  const p=players[id];if(!p.alive)return;
  p.row++;p.score++;maxReached=Math.max(maxReached,p.row);matchHigh=Math.max(matchHigh,p.score);
  ensureWorld();
  if(collision(p)){
    p.alive=false;
    toast.textContent="こみゃく ぺしゃんこ！";toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),600);
  }
  cam=Math.max(0,maxReached-2.2);
  updateScores();
  const alive=players.filter(x=>x.alive).length;
  status.textContent=alive?`進行中：残り ${alive}人　／　最高到達 ${maxReached}マス`:"4人全員アウト。次の4人へ交代できます。";
  if(!alive){roundOver=true;document.getElementById("next").style.display="block"}
}
function nextGroup(){
  for(let i=0;i<players.length;i++){players[i].row=0;players[i].lane=i-1.5;players[i].alive=true;players[i].score=0}
  obstacles.length=0;cam=0;maxReached=0;matchHigh=0;roundOver=false;
  document.getElementById("next").style.display="none";status.textContent="次の4人スタート！";
  ensureWorld();updateScores();
}
function updateScores(){
  const personal=Math.max(...players.map(p=>p.score),0),my=+localStorage.getItem("komyakuMyHigh")||0,all=+localStorage.getItem("komyakuAllHigh")||0;
  if(personal>my)localStorage.setItem("komyakuMyHigh",personal);
  if(maxReached>all)localStorage.setItem("komyakuAllHigh",maxReached);
  matchHigh=Math.max(matchHigh,0);
  document.getElementById("matchHigh").textContent=matchHigh;
  document.getElementById("myHigh").textContent=Math.max(personal,my);
  document.getElementById("allHigh").textContent=Math.max(maxReached,all);
}
function animate(now){
  const dt=Math.min(.05,(now-(animate.last||now))/1000);animate.last=now;
  if(!roundOver)for(const o of obstacles){o.x+=o.speed*o.dir*dt;if(o.x>2)o.x=-2;if(o.x<-2)o.x=2}
  ctx.clearRect(0,0,W,H);drawWorld();
  const items=[];for(const o of obstacles)items.push({row:o.row,t:"o",v:o});for(const p of players)items.push({row:p.row,t:"p",v:p});
  items.sort((a,b)=>b.row-a.row);
  for(const it of items)it.t==="o"?drawObstacle(it.v):drawPlayer(it.v);
  requestAnimationFrame(animate);
}
function boot(){
  resize();
  ensureWorld();
  updateScores();
  draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(()=>{ resize(); draw(); });
setTimeout(()=>{ resize(); ensureWorld(); draw(); }, 80);
boot();
</script>
