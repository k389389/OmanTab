.stage {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
}
/* ポスター画像内のタイトルとミャクミャクの間に置くボタン */
.main-button {
  position: absolute;
  top: 36%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: auto;
  min-width: 0;
  padding-left: 24px;
  padding-right: 24px;
  padding: 15px 18px;
  border: 3px solid white;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff416c, #ff8b00);
  color: white;
  font-size: clamp(23px, 5vw, 32px);
  font-weight: 900;
  box-shadow: 0 6px 18px rgba(0,0,0,.3);
  cursor: pointer;
  z-index: 2;
}
.main-button:active { transform: translate(-50%, -50%) scale(.97); }
.game-menu {
  display: none;
  position: relative;
  z-index: 3;
  width: min(92%, 720px);
  margin: 0 auto;
  top: 45vh;
  padding: 18px;
  border: 3px solid white;
  border-radius: 24px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.game-menu.show { display: block; }
.game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.game-button, .panic-button {
  display: flex; align-items: center; justify-content: center;
  min-height: 58px; padding: 12px 10px;
  border: 2px solid white; border-radius: 16px;
  background: linear-gradient(135deg, #0879df, #6250d9);
  color: white; text-decoration: none; text-align: center;
  font-size: clamp(15px, 3.5vw, 21px); font-weight: bold;
  cursor: pointer; box-shadow: 0 4px 9px rgba(0,0,0,.2);
}
.panic-menu {
  display: none; margin-top: 14px; padding: 15px;
  border: 3px solid #ff6688; border-radius: 18px;
  background: rgba(240,248,255,.98);
}
.panic-menu.show { display: block; }
.panic-title { margin: 0 0 12px; color: #e62956; font-size: 23px; font-weight: bold; }
.panic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.panic-button { background: linear-gradient(135deg, #ff4b6e, #ff9d00); }
@media (max-width: 600px) {
  body { background-size: 100% 100%; }
  .main-button { top: 36%; width: auto; min-width: 0; padding: 13px 20px; }
  .game-menu { top: 44vh; padding: 13px; }
  .game-grid, .panic-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="stage">

<script>
function toggleGames() {
  const menu = document.getElementById("gameMenu");
  menu.classList.toggle("show");
  if (!menu.classList.contains("show")) {
    document.getElementById("panicMenu").classList.remove("show");
  }
}
function togglePanic() {
  document.getElementById("panicMenu").classList.toggle("show");
}
</script>
