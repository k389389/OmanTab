<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>万博クロッシング こみゃく 2.5D試作</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#fff}
body{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
header{background:#10283b;padding:7px 9px;z-index:20;box-shadow:0 2px 8px #0008}
.title{text-align:center;font-weight:900;font-size:17px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
.card{background:#17374d;border-radius:8px;text-align:center;padding:4px;font-size:9px}
.card b{display:block;font-size:16px}
#game{position:relative;flex:1;min-height:0;background:#79b94e}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;left:8px;right:8px;top:8px;background:#0009;border-radius:10px;padding:6px;text-align:center;font-size:11px;z-index:10}
#toast{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) scale(.8);background:#000d;border-radius:16px;padding:12px 20px;font-size:22px;font-weight:900;opacity:0;pointer-events:none;z-index:30;transition:.16s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#controls{background:#0d2233;padding:7px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:20}
.ctrl{border:0;border-radius:10px;color:#fff;padding:8px 2px;font-weight:900;font-size:12px;touch-action:manipulation}
.ctrl small{display:block;font-size:9px;opacity:.8}
.red{background:#c83232}.blue{background:#2e69c9}.yellow{background:#b78b00}.green{background:#2e8b50}
#next{display:none;margin:5px 8px;border:0;border-radius:10px;padding:8px;background:#fff;color:#142638;font-weight:900}
.legend{background:#0d2233;text-align:center;font-size:9px;opacity:.75;padding:2px 0 4px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">🌏 万博クロッシング　こみゃく</div>
  <div class="scores">
    <div class="card">今回の試合ハイスコア<b id="matchHigh">0</b></div>
    <div class="card">あなたのハイスコア<b id="myHigh">0</b></div>
    <div class="card">全体ハイスコア<b id="allHigh">0</b></div>
  </div>
</header>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="status">タップで1マス前進！ 下から上へ進み続けよう。</div>
  <div id="toast"></div>
</div>
<div id="controls">
  <button class="ctrl red" onclick="movePlayer(0)">🔴 こみゃく<small>タップで前進</small></button>
  <button class="ctrl blue" onclick="movePlayer(1)">🔵 こみゃく<small>タップで前進</small></button>
  <button class="ctrl yellow" onclick="movePlayer(2)">🟡 こみゃく<small>タップで前進</small></button>
  <button class="ctrl green" onclick="movePlayer(3)">🟢 こみゃく<small>タップで前進</small></button>
</div>
<button id="next" onclick="nextGroup()">次の4人をスタート</button>
<div class="legend">2.5D試作：ゴールなし・エンドレス／スコア＝進んだマス数</div>
</div>

};
const colors=["red","blue","yellow","green"];
const players=colors.map((c,i)=>({id:i,color:c,row:0,x:(i-1.5)*0.23,alive:true,score:0}));
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const game=document.getElementById("game");
const toast=document.getElementById("toast"),status=document.getElementById("status");
const images={}; for(const c of colors){images[c]=new Image();images[c].src=IMG[c];}

let W=0,H=0,DPR=1;
let camera=0,maxReached=0,matchHigh=0,roundOver=false,group=1,last=performance.now();

const ROWS_AHEAD=20, ROWS_BEHIND=4;

// 各行の種類。エンドレスに生成される。
function lane(row){
  if(row===0) return "grass";
  if(row%3===1 || row%8===0) return "road";
  if(row%11===0) return "river";
  return "grass";
}

// ワールド上の障害物。xは道路幅を -1.25～1.25 で表現。
const obstacles=[];
function ensureObstacles(){
  const lo=Math.max(1,Math.floor(camera-ROWS_BEHIND));
  const hi=Math.ceil(camera+ROWS_AHEAD);
  for(let r=lo;r<=hi;r++){
    if(lane(r)!=="road") continue;
    if(obstacles.some(o=>o.row===r)) continue;
    const dir=r%2===0?1:-1;
    const count=r%7===0?1:2;
    for(let i=0;i<count;i++){
      obstacles.push({
        row:r,dir,
        x:dir>0?-1.35-i*1.35:1.35+i*1.35,
        speed:r%7===0?.46:.34+(r%5)*.025,
        width:r%7===0?.55:.40,
        kind:r%7===0?"bus":"car"
      });
    }
  }
}

function cleanup(){
  const lo=camera-ROWS_BEHIND-4;
  for(let i=obstacles.length-1;i>=0;i--) if(obstacles[i].row<lo) obstacles.splice(i,1);
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=game.clientWidth; H=game.clientHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

function persp(row){
  // row-camera が奥。奥ほど小さくなる。
  const d=row-camera;
  const s=Math.max(.52,1-d*.035);
  const y=H*.79-d*(H*.052*s);
  return {d,s,y};
}

function roadPolygon(row){
  const p=persp(row);
  const s=p.s, y=p.y;
  const nearW=W*.92*s, farW=W*.46*s;
  const top=y-54*s, bot=y+54*s;
  return [
    [W/2-farW/2,top],[W/2+farW/2,top],
    [W/2+nearW/2,bot],[W/2-nearW/2,bot]
  ];
}

function drawGround(){
  ctx.fillStyle="#79b94e";ctx.fillRect(0,0,W,H);

  // 奥行きのある芝生の行
  for(let r=Math.max(0,Math.floor(camera-ROWS_BEHIND));r<=Math.ceil(camera+ROWS_AHEAD);r++){
    const p=persp(r);
    if(p.y<-100 || p.y>H+100) continue;
    if(lane(r)==="road"){
      const poly=roadPolygon(r);
      ctx.beginPath();poly.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
      ctx.fillStyle="#555";ctx.fill();
      ctx.strokeStyle="#777";ctx.lineWidth=1;ctx.stroke();

      // 道路中央の破線
      ctx.strokeStyle="#ddd9";ctx.lineWidth=Math.max(1,3*p.s);
      ctx.setLineDash([24*p.s,22*p.s]);
      ctx.beginPath();ctx.moveTo(W/2,p.y-52*p.s);ctx.lineTo(W/2,p.y+52*p.s);ctx.stroke();
      ctx.setLineDash([]);
    } else if(lane(r)==="river"){
      const s=p.s, y=p.y;
      const w=W*.86*s;
      ctx.fillStyle="#4199d1";
      ctx.beginPath();ctx.moveTo(W/2-w*.28,y-48*s);ctx.lineTo(W/2+w*.28,y-48*s);
      ctx.lineTo(W/2+w*.48,y+48*s);ctx.lineTo(W/2-w*.48,y+48*s);ctx.closePath();ctx.fill();
      ctx.strokeStyle="#8dd8ff99";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(W*.36,y);ctx.lineTo(W*.64,y);ctx.stroke();
    } else {
      // 芝生の境界線
      ctx.strokeStyle="#ffffff18";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,p.y-50*p.s);ctx.lineTo(W,p.y-50*p.s);ctx.stroke();
    }
  }

  // 奥行きのあるサイドオブジェクト
  for(let r=Math.floor(camera);r<=Math.ceil(camera+ROWS_AHEAD);r+=2){
    const p=persp(r);
    if(p.y<0||p.y>H) continue;
    const size=30*p.s;
    ctx.font=size+"px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("🌳",W*.12,p.y);
    ctx.fillText("🌳",W*.88,p.y);
  }
}

function worldXToScreen(x,row){
  const p=persp(row);
  // 道路上の -1.25～1.25 を画面へ
  return W/2 + x*(W*.36*p.s);
}

function drawObstacle(o){
  if(o.row<camera-ROWS_BEHIND||o.row>camera+ROWS_AHEAD)return;
  const p=persp(o.row), x=worldXToScreen(o.x,o.row);
  const scale=p.s;
  const ww=(o.kind==="bus"?100:78)*scale, hh=44*scale;
  ctx.save();
  ctx.translate(x,p.y-18*scale);
  ctx.scale(o.dir,1);
  ctx.shadowColor="#0008";ctx.shadowBlur=7;ctx.shadowOffsetY=5;
  ctx.fillStyle=o.kind==="bus"?"#e8b51f":"#d73b3b";
  roundRect(ctx,-ww/2,-hh/2,ww,hh,10*scale);ctx.fill();
  ctx.shadowColor="transparent";
  ctx.font=(27*scale)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(o.kind==="bus"?"🚌":"🚗",0,1);
  ctx.restore();
}

function drawPlayer(p){
  if(!p.alive)return;
  const q=persp(p.row);
  const x=W/2+p.x*(W*.36*q.s);
  const size=66*q.s;
  const img=images[p.color];
  ctx.save();
  ctx.translate(x,q.y-35*q.s);
  // 疑似3D：奥行きに応じた縮小＋影＋少し立体感
  ctx.shadowColor="#0009";ctx.shadowBlur=9*q.s;ctx.shadowOffsetY=8*q.s;
  ctx.drawImage(img,-size/2,-size/2,size,size);
  ctx.shadowColor="transparent";
  ctx.globalAlpha=.25;
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-size*.17,-size*.24,size*.16,size*.08,-.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

function collision(p){
  if(lane(p.row)!=="road")return false;
  for(const o of obstacles){
    if(o.row!==p.row)continue;
    // ワールド座標で判定。前方の車には反応しない。
    const playerHalf=.13;
    if(Math.abs(p.x-o.x)<playerHalf+o.width/2)return true;
  }
  return false;
}

function movePlayer(id){
  if(roundOver)return;
  const p=players[id]; if(!p.alive)return;
  p.row++;
  p.score++;
  maxReached=Math.max(maxReached,p.row);
  matchHigh=Math.max(matchHigh,p.score);

  ensureObstacles();
  if(collision(p)){
    p.alive=false;
    toast.textContent="こみゃく ぺしゃんこ！";
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),650);
  }

  // 先頭のプレイヤーを基準にカメラを少しだけ前へ。
  camera=Math.max(0,maxReached-1.5);
  cleanup();ensureObstacles();
  updateScores();

  const alive=players.filter(x=>x.alive).length;
  status.textContent=alive
    ? `進行中：残り ${alive}人　／　最高到達 ${maxReached}マス`
    : "4人全員アウト。次の4人へ交代できます。";
  if(alive===0){
    roundOver=true;
    document.getElementById("next").style.display="block";
  }
}

function nextGroup(){
  group++;
  for(let i=0;i<players.length;i++){
    players[i].row=0;players[i].x=(i-1.5)*.23;players[i].alive=true;players[i].score=0;
  }
  obstacles.length=0;camera=0;maxReached=0;matchHigh=0;roundOver=false;
  document.getElementById("next").style.display="none";
  status.textContent=`グループ${group} スタート！ タップで1マス前進。`;
  ensureObstacles();updateScores();
}

function updateScores(){
  const personal=Math.max(...players.map(p=>p.score),0);
  const my=Number(localStorage.getItem("komyakuMyHigh")||0);
  const all=Number(localStorage.getItem("komyakuAllHigh")||0);
  if(personal>my)localStorage.setItem("komyakuMyHigh",personal);
  if(maxReached>all)localStorage.setItem("komyakuAllHigh",maxReached);
  document.getElementById("matchHigh").textContent=matchHigh;
  document.getElementById("myHigh").textContent=Math.max(personal,my);
  document.getElementById("allHigh").textContent=Math.max(maxReached,all);
}

function animate(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!roundOver){
    for(const o of obstacles){
      o.x+=o.speed*o.dir*dt;
      if(o.dir>0 && o.x>1.6)o.x=-1.6;
      if(o.dir<0 && o.x<-1.6)o.x=1.6;
    }
  }
  draw();
  requestAnimationFrame(animate);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawGround();
  // 奥→手前の順に描画
  const list=[];
  for(const o of obstacles)list.push({type:"o",row:o.row,obj:o});
  for(const p of players)list.push({type:"p",row:p.row,obj:p});
  list.sort((a,b)=>b.row-a.row);
  for(const it of list){
    if(it.type==="o")drawObstacle(it.obj); else drawPlayer(it.obj);
  }
}

resize();ensureObstacles();updateScores();requestAnimationFrame(animate);
</script>
</body>
